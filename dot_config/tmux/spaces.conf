# WezTerm's CMD+1-9 send prefix M-1..9 whatever @spaces says, and with spaces
# off that key means what CMD+1-9 always did: window N. (Not tmux's stock
# prefix M-1..M-7 layout presets, which are replaced in both modes.)
bind -N "Select window 1" M-1 select-window -t :=1
