# SPACES — sourced from the bottom of tmux.conf. Design: docs/spaces.md.
#
# A space is a tmux session; an agent is a window with a non-empty
# @agent_state (the agent-tab indicator sets it for every live claude/codex
# window, idle included); every other window is a shell.
#
# This file is separate from tmux.conf for one reason: `%if` is evaluated when
# a file is PARSED, before any of its commands run, so a `%if` on @spaces in
# tmux.conf would see the value from the previous load (empty on a cold
# start). tmux.conf sets @spaces and then source-files this, by which time the
# set has run.
#
# @spaces off + reload restores today's keys and status line exactly: every
# `%else` line below undoes its `%if` twin (tests/test_spaces.py checks the
# round trip against a fresh server).
#
# Needs from tmux.conf: @spaces, @space_hidden_sessions.

# The logic script, and the home dashboard's (the command its pane runs).
# Tests point these at the chezmoi source copies.
set -gF @space_sh "#{?@space_sh,#{@space_sh},#{HOME}/.config/tmux/scripts/space.sh}"
set -gF @space_dash "#{?@space_dash,#{@space_dash},#{HOME}/.config/tmux/scripts/space-dash.sh}"
# The agent sidebar's binary (for `sidebar --repair`, below). Tests point it
# at a stand-in.
set -gF @space_agent_ui "#{?@space_agent_ui,#{@space_agent_ui},#{HOME}/.local/bin/agent-ui}"
# The messages below (refusals, the sidebar scope) go through notify.sh: a
# toast in the agent sidebar when one is open for the pressing client, else
# tmux's own display-message, as before. Tests point it at a stand-in.
set -gF @notify_sh "#{?@notify_sh,#{@notify_sh},#{HOME}/.config/tmux/scripts/notify.sh}"
# @agent_birth, which the claude-tab keys below run (tmux.conf sources it
# too; again here for a server that loaded only this file).
source-file -F "#{d:current_file}/agent-birth.conf"

# ── hidden sessions: marked whatever the flag says ──────────────────────────
# @space_hidden 1 on every session named in @space_hidden_sessions, at birth
# (pure tmux, so a status line never flashes one) and again by `space.sh sync`,
# which also numbers the visible sessions (@space_index: main = 1, then the
# registry's order) for the space tabs and prefix 1-9. Rename and close
# renumber. With @spaces on, sync also keeps one home window per space and
# the registry (docs/spaces.md); `sync load` at config load recreates
# registered spaces that are missing. Index [20]: [90] belongs to tmux-mcp's
# poke hooks.
set-hook -g 'session-created[20]' {
  if -F "#{m:* #{session_name} *, #{@space_hidden_sessions} }" { set @space_hidden 1 }
  run-shell -b "#{@space_sh} sync"
}
set-hook -g 'session-closed[20]' 'run-shell -b "#{@space_sh} sync"'
set-hook -g 'session-renamed[20]' 'run-shell -b "#{@space_sh} sync"'
run-shell -b "#{@space_sh} sync load"

# A home shell (docs/spaces.md) that exits is respawned in place: the home
# PANE (@space_home_pane; other panes split into the home window are
# ordinary) carries remain-on-exit, so it stays (dead) and this hook fires.
# Not gated on @spaces: a home made while on must not turn into a dead pane
# when the flag goes off. The home's dashboard pane (@space_dash_pane, the
# top of the home window, scripts/space-dash.sh) is respawned the same way.
set-hook -g 'pane-died[20]' { if -F "#{||:#{@space_home_pane},#{@space_dash_pane}}" { run-shell -b "#{@space_sh} respawn-home '#{pane_id}'" } }
# The dashboard never holds the focus: whatever makes it a window's active
# pane (a click, prefix Up, C-k from vim-tmux-navigator, the pane below it
# closing) hands the focus straight to the pane below it, the most recently
# used one there. Pure tmux, no fork; not gated, as the dashboard outlives
# the flag like its home does.
set-hook -g 'window-pane-changed[20]' { if -F "#{@space_dash_pane}" { select-pane -t "{down-of}" } }

# ── the digit chords: one private sequence each ─────────────────────────────
# WezTerm (wezterm.lua.tmpl, the last loop) sends every digit chord as its own
# escape sequence, which tmux reads as ONE key, User0..User26:
#   CTRL+N  \e[911N~  User0..User8    space N's home   (off: window N)
#   OPT+N   \e[912N~  User9..User17   M-N to the pane, on and off
#   CMD+N   \e[913N~  User18..User26  agent N   (off: window N)
# One key per chord, so nothing hangs on timing or on a stray modifier: CMD+N
# used to send the prefix and then ESC N, the very bytes of Option+N, so a
# dropped prefix or a touched Option sent Option+N instead. The mixed chords
# (CMD+OPT+N, CMD+CTRL+N, CTRL+OPT+N, CMD+SHIFT+N) are swallowed in WezTerm.
# No real terminal sends CSI 9111-9139 ~. Set whatever @spaces says: the User
# bindings in the two branches below decide what each one does.
set -s user-keys[0] "\e[9111~"
set -s user-keys[1] "\e[9112~"
set -s user-keys[2] "\e[9113~"
set -s user-keys[3] "\e[9114~"
set -s user-keys[4] "\e[9115~"
set -s user-keys[5] "\e[9116~"
set -s user-keys[6] "\e[9117~"
set -s user-keys[7] "\e[9118~"
set -s user-keys[8] "\e[9119~"
set -s user-keys[9] "\e[9121~"
set -s user-keys[10] "\e[9122~"
set -s user-keys[11] "\e[9123~"
set -s user-keys[12] "\e[9124~"
set -s user-keys[13] "\e[9125~"
set -s user-keys[14] "\e[9126~"
set -s user-keys[15] "\e[9127~"
set -s user-keys[16] "\e[9128~"
set -s user-keys[17] "\e[9129~"
set -s user-keys[18] "\e[9131~"
set -s user-keys[19] "\e[9132~"
set -s user-keys[20] "\e[9133~"
set -s user-keys[21] "\e[9134~"
set -s user-keys[22] "\e[9135~"
set -s user-keys[23] "\e[9136~"
set -s user-keys[24] "\e[9137~"
set -s user-keys[25] "\e[9138~"
set -s user-keys[26] "\e[9139~"

%if "#{==:#{@spaces},on}"

# ── status: ONE line = this space, other spaces that need you, its shells ──
# (shown only while no agent sidebar is open; the sidebar has all of it)
# The full list of spaces, with their ⌃N numbers, lives in the sidebar; the
# status line names only the space you are in, plus a dot for any other space
# with an agent that needs you.
#
# THIS SPACE: a solid chip in the space's own colour (@space_color, which
# `space.sh sync` keeps from the registry; peach until it has one), bold
# crust text `⌃N name`, ended by a powerline edge and a two-cell gap (one
# here, one before each alert or the shells), so it never reads as one of the
# shell tabs after it. The label is the session
# option @space_key, the key that reaches the space (`space.sh sync` sets it
# with @space_index: ⌃N, Ctrl+N being space N), so a different key scheme
# changes one line of space.sh, not this format. A space with no key (past 9)
# shows its name alone; its alert shows the name instead of a key.
#   HOME   a 󰋜 after the name, inside the chip, while you are on the space's
#          home window (@space_home): a space IS its home (⌃N lands there),
#          so home has no shell tab of its own
#   CHIP   the space's colour, RED while the prefix is pressed (what
#          catppuccin's session module, gone while spaces are on, said)
#   STATE  after the edge, the space's ROLLUP (its most urgent agent): a ●
#          red failed > yellow needs-* > green done (done+workflow does not
#          count, as on the window tab); nothing when none of those
#   GLYPH  󰒓 any background workflow, else 󰍽 any computer use
# OTHER SPACES THAT NEED YOU: `⌃N●`, the ⌃N in that space's colour and the ●
# red / yellow / green, the same three states prefix d walks (agent-jump.sh);
# in-flight and idle spaces never show.
# Each is a session range, so a click switches (tmux's own switch-client -t =).
# One S: loop, in name order; hidden sessions are never looped into (agents
# has hundreds of windows): the #{?#{@space_hidden},,…} guard skips them
# before any W: runs. No #() anywhere: this redraws every second while the
# watcher blinks.
set -g @space_fail '#{W:#{?#{==:#{@agent_state},failed},1,}}'
set -g @space_need '#{W:#{?#{m:needs-*,#{@agent_state}},1,}}'
set -g @space_done '#{W:#{?#{&&:#{==:#{@agent_state},done},#{&&:#{!:#{@agent_workflow}},#{!:#{@agent_paused}}}},1,}}'
set -g @space_wf '#{W:#{?#{@agent_workflow},1,}}'
set -g @space_cua '#{W:#{?#{@agent_cua},1,}}'
set -g @space_cur '#{==:#{session_name},#{client_session}}'
set -g @space_hot '#{||:#{E:@space_fail},#{||:#{E:@space_need},#{E:@space_done}}}'
set -g @space_col '#{?#{@space_color},#{@space_color},#fab387}'
set -g @space_dot '#{?#{E:@space_fail},#f38ba8,#{?#{E:@space_need},#f9e2af,#a6e3a1}}'
set -g @space_state '#{?#{E:@space_hot}, #[fg=#{E:@space_dot}]●,}'
set -g @space_glyph '#{?#{E:@space_wf}, #[fg=#{?#{@agent_blink},#94e2d5,#659a91}]󰒓,#{?#{E:@space_cua}, #[fg=#{?#{@agent_blink},#89b4fa,#5d7aaa}]󰍽,}}'
set -g @space_chip '#{?client_prefix,#f38ba8,#{E:@space_col}}'
set -g @space_here '#[range=session|#{session_id}]#[fg=#{E:@space_chip},bg=default]█#[fg=#11111b,bg=#{E:@space_chip},bold]#{?#{@space_key},#{@space_key} ,}#{session_name}#{?#{@space_home}, 󰋜,}#[fg=#{E:@space_chip},bg=default,nobold]#[norange default]#{E:@space_state}#{E:@space_glyph} '
set -g @space_alert ' #[range=session|#{session_id}]#[fg=#{E:@space_col}]#{?#{@space_key},#{@space_key},#{session_name}}#[fg=#{E:@space_dot}]●#[norange default]'
set -g @space_alerts '#{S:#{?#{@space_hidden},,#{?#{E:@space_cur},,#{?#{E:@space_hot},#{E:@space_alert},}}}}'

# A shell tab: stock catppuccin colours (peach chip when it is the window you
# are on), marked with its LETTER (@agent_key: shells and agents draw from one
# pool, which the agent sidebar assigns; ⌥W then the letter goes there, as for
# an agent), · until it has one, and labelled with its folder while a shell
# sits at the prompt, else with what runs in it (nvim, nu, ...). The home
# window (@space_home) gets no tab: ⌃N reaches it, and the space's chip wears
# a 󰋜 while you are on it.
set -g @space_shell_label '#{?#{m/r:^-?(zsh|bash|sh|fish)$,#{pane_current_command}},#{?#{==:#{pane_current_path},#{HOME}},~,#{b:pane_current_path}},#{pane_current_command}}'
set -g @space_shell '#[range=window|#{window_index}]#[fg=#{?window_active,#fab387,#89b4fa},bg=default]█#[fg=#{?window_active,#1e1e2e,#313244},bg=#{?window_active,#fab387,#89b4fa}]#{?#{@agent_key},#{@agent_key},·}#[fg=#{?window_active,#fab387,#89b4fa},bg=#{?window_active,#1e1e2e,#313244}]█ #[fg=#cdd6f4]#{E:@space_shell_label}#[fg=#{?window_active,#1e1e2e,#313244},bg=default]█#[norange default]'

# After the chips: this space's shells (home and agents skipped), then a [+]
# that opens a new one at the space's folder (MouseDown1Status below).
# Nothing is looped in a hidden session; there the line starts with its name,
# dimmed, so you know where you are (the other spaces' alerts still show).
#
# EXCEPT while a stash range selection (prefix v; scripts/stash.sh sel-*) is
# live in this space. Its only feedback is the @stash_sel tint on window tabs,
# and with spaces on the agents have no tab. So while any window here carries
# @stash_sel, the shells give way to EVERY window of the space as today's
# catppuccin tab (window-status-format / -current-format, which hold the mauve
# @stash_sel tint and the agent tints) — the pre-spaces bar, for the length of
# the gesture. stash.sh flags the starting tab at once, clears the flag on
# commit/cancel and refreshes the client on every step, so the presence of
# the flag IS the "selection active" marker; nothing extra is needed.
set -g @space_sel_tabs '#{W:#[range=window|#{window_index}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default],#[range=window|#{window_index}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange default]}'
set -g @space_shell_tabs '#{W:#{?#{||:#{@agent_state},#{@space_home}},,#{E:@space_shell}}}#[range=user|space-new]#[fg=#6c7086] [+] #[norange default]'

# One line: status-left as today, this space's tab (or a hidden session's
# dimmed name), the alerts, a space, the shells; and on the right today's
# status-right, which loses only catppuccin's `session` module while spaces
# are on (tmux.conf builds @catppuccin_status_modules_right from @spaces; the
# space tab names the session now). `set -gu` first drops any line 1 a
# two-line config left behind.
# A hidden session's name: dimmed, or crust on red while the prefix is
# pressed, as the space tab's chip (the commas in a #{?} branch are #,).
set -g @space_hidden_tag '#{?client_prefix,#[fg=#11111b#,bg=#f38ba8],#[fg=#6c7086]}[#{session_name}]#[default]'
# The agent sidebar (agent-ui) keeps @sidebar_open, the number of sidebars
# open, and turns the status line off while any is (the sidebar shows all of
# it). A reload keeps to that instead of turning it back on.
# A sidebar killed outright (SIGKILL) never counts itself out, which would
# leave the line off for good; `agent-ui sidebar --repair` recounts the live
# sidebars (and turns the line on at 0). It runs here, synchronously, BEFORE
# the gate below reads the count, and whenever a client attaches
# (client-attached[21]). No agent-ui binary means no sidebar: the count is
# dropped, so the line is on, and so are its clients and width (popups centre
# on the client again: tmux.conf's @popup_x).
set -g @space_sidebar_repair 'B="#{@space_agent_ui}"; if [ -x "$B" ]; then "$B" sidebar --repair >/dev/null 2>&1; else tmux set -gu @sidebar_open \; set -gu @sidebar_clients \; set -gu @sidebar_width; fi; true'
run-shell "#{E:@space_sidebar_repair}"
set-hook -g 'client-attached[21]' { run-shell -b "#{E:@space_sidebar_repair}" }
if -F "#{&&:#{@sidebar_open},#{!=:#{@sidebar_open},0}}" { set -g status off } { set -g status on }
set -gu status-format
set -g 'status-format[0]' '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[align=left]#{?#{@space_hidden},#{E:@space_hidden_tag},#{E:@space_here}}#{E:@space_alerts}#{?#{@space_hidden},, #{?#{W:#{?#{@stash_sel},1,}},#{E:@space_sel_tabs},#{E:@space_shell_tabs}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'

# Clicks: a shell tab is a window range, which tmux's own `switch-client -t =`
# handles. A space chip (this space's, or another's alert) is a session range,
# and a click on it lands on that space's HOME, as ⌃N does: home has no tab,
# and `-t =` would land on the space's last-active window. In a mouse binding
# the formats expand in the clicked session (tmux sets the mouse target from
# the range's session), so #{session_id} and its W: loop are that space's,
# the same $S:@home target as the ⌃N bindings. [+] opens a shell.
bind -n MouseDown1Status if -F "#{==:#{mouse_status_range},space-new}" { new-window -a -t "{end}" -c "#{session_path}" } { if -F "#{==:#{mouse_status_range},session}" { run-shell -C "switch-client -t '#{s/ .*//:#{session_id}#{W:#{?#{@space_home},:#{window_id} ,}}}'" } { switch-client -t = } }

# ── keys ────────────────────────────────────────────────────────────────────
# The digit rows (WezTerm sends the prefix ones; wezterm.lua.tmpl):
#   Control-1..9  prefix 1-9      space N, in tab order: its HOME window
#   Option-1..9   M-1..M-9        nothing of ours: they reach the pane
#   Command-1..9  prefix M-1..9   agent N of this space
# A space IS its home: prefix N lands on space N's home window (@space_home),
# never on whatever window was last active there, and that holds for the
# space you are already in. The other shells are reached by their letter
# (⌥W, below), like agents. No fork: an S: loop finds the session whose
# @space_index is N and a nested W: loop its home, for one
# `switch-client -t '$S:@W'` (#{s/ .*//:} keeps the first match; no home,
# which sync never leaves for long, means the bare session). Only a miss
# forks, for notify.sh's "no space N".
bind -N "Go to space 1" 1 run-shell -C "#{?#{S:#{?#{==:#{@space_index},1},1,}},switch-client -t '#{s/ .*//:#{S:#{?#{==:#{@space_index},1},#{session_id}#{W:#{?#{@space_home},:#{window_id} ,}},}}}',run-shell -b '#{@notify_sh} -k warn -c \"#{client_name}\" -- \"no space 1\"'}"
bind -N "Go to space 2" 2 run-shell -C "#{?#{S:#{?#{==:#{@space_index},2},1,}},switch-client -t '#{s/ .*//:#{S:#{?#{==:#{@space_index},2},#{session_id}#{W:#{?#{@space_home},:#{window_id} ,}},}}}',run-shell -b '#{@notify_sh} -k warn -c \"#{client_name}\" -- \"no space 2\"'}"
bind -N "Go to space 3" 3 run-shell -C "#{?#{S:#{?#{==:#{@space_index},3},1,}},switch-client -t '#{s/ .*//:#{S:#{?#{==:#{@space_index},3},#{session_id}#{W:#{?#{@space_home},:#{window_id} ,}},}}}',run-shell -b '#{@notify_sh} -k warn -c \"#{client_name}\" -- \"no space 3\"'}"
bind -N "Go to space 4" 4 run-shell -C "#{?#{S:#{?#{==:#{@space_index},4},1,}},switch-client -t '#{s/ .*//:#{S:#{?#{==:#{@space_index},4},#{session_id}#{W:#{?#{@space_home},:#{window_id} ,}},}}}',run-shell -b '#{@notify_sh} -k warn -c \"#{client_name}\" -- \"no space 4\"'}"
bind -N "Go to space 5" 5 run-shell -C "#{?#{S:#{?#{==:#{@space_index},5},1,}},switch-client -t '#{s/ .*//:#{S:#{?#{==:#{@space_index},5},#{session_id}#{W:#{?#{@space_home},:#{window_id} ,}},}}}',run-shell -b '#{@notify_sh} -k warn -c \"#{client_name}\" -- \"no space 5\"'}"
bind -N "Go to space 6" 6 run-shell -C "#{?#{S:#{?#{==:#{@space_index},6},1,}},switch-client -t '#{s/ .*//:#{S:#{?#{==:#{@space_index},6},#{session_id}#{W:#{?#{@space_home},:#{window_id} ,}},}}}',run-shell -b '#{@notify_sh} -k warn -c \"#{client_name}\" -- \"no space 6\"'}"
bind -N "Go to space 7" 7 run-shell -C "#{?#{S:#{?#{==:#{@space_index},7},1,}},switch-client -t '#{s/ .*//:#{S:#{?#{==:#{@space_index},7},#{session_id}#{W:#{?#{@space_home},:#{window_id} ,}},}}}',run-shell -b '#{@notify_sh} -k warn -c \"#{client_name}\" -- \"no space 7\"'}"
bind -N "Go to space 8" 8 run-shell -C "#{?#{S:#{?#{==:#{@space_index},8},1,}},switch-client -t '#{s/ .*//:#{S:#{?#{==:#{@space_index},8},#{session_id}#{W:#{?#{@space_home},:#{window_id} ,}},}}}',run-shell -b '#{@notify_sh} -k warn -c \"#{client_name}\" -- \"no space 8\"'}"
bind -N "Go to space 9" 9 run-shell -C "#{?#{S:#{?#{==:#{@space_index},9},1,}},switch-client -t '#{s/ .*//:#{S:#{?#{==:#{@space_index},9},#{session_id}#{W:#{?#{@space_home},:#{window_id} ,}},}}}',run-shell -b '#{@notify_sh} -k warn -c \"#{client_name}\" -- \"no space 9\"'}"

# Option-1..9 are not ours (they were "shell N"; shells have letters now):
# unbound, so a reload from an older spaces.conf drops them and they reach
# the pane, as with spaces off. (Pinned agent N is ⌥W then N: the jump
# table, below.) Command-1..9 (prefix M-1..9) → agent N (the
# agent sidebar numbers agents the same way). Option-L / Option-H → next /
# previous of the same kind (NOT M-j/M-k: Claude Code binds meta+j to
# app:toggleTerminal). Option-` → agent <-> last shell of this space.
# Option-N → new space. In a hidden session (agents, stash, tasks, ...) these
# do nothing but say so (notify.sh), decided by a format; space.sh refuses
# them there too. prefix M-1..M-7 were tmux's layout presets; replaced.
unbind -q -n M-1
unbind -q -n M-2
unbind -q -n M-3
unbind -q -n M-4
unbind -q -n M-5
unbind -q -n M-6
unbind -q -n M-7
unbind -q -n M-8
unbind -q -n M-9
bind -N "Go to agent 1" M-1 if -F "#{@space_hidden}" { run-shell -b "#{@notify_sh} -k warn -c '#{client_name}' -- 'space: not a space'" } { run-shell -b "#{@space_sh} agent 1 '#{session_id}' '#{client_name}'" }
bind -N "Go to agent 2" M-2 if -F "#{@space_hidden}" { run-shell -b "#{@notify_sh} -k warn -c '#{client_name}' -- 'space: not a space'" } { run-shell -b "#{@space_sh} agent 2 '#{session_id}' '#{client_name}'" }
bind -N "Go to agent 3" M-3 if -F "#{@space_hidden}" { run-shell -b "#{@notify_sh} -k warn -c '#{client_name}' -- 'space: not a space'" } { run-shell -b "#{@space_sh} agent 3 '#{session_id}' '#{client_name}'" }
bind -N "Go to agent 4" M-4 if -F "#{@space_hidden}" { run-shell -b "#{@notify_sh} -k warn -c '#{client_name}' -- 'space: not a space'" } { run-shell -b "#{@space_sh} agent 4 '#{session_id}' '#{client_name}'" }
bind -N "Go to agent 5" M-5 if -F "#{@space_hidden}" { run-shell -b "#{@notify_sh} -k warn -c '#{client_name}' -- 'space: not a space'" } { run-shell -b "#{@space_sh} agent 5 '#{session_id}' '#{client_name}'" }
bind -N "Go to agent 6" M-6 if -F "#{@space_hidden}" { run-shell -b "#{@notify_sh} -k warn -c '#{client_name}' -- 'space: not a space'" } { run-shell -b "#{@space_sh} agent 6 '#{session_id}' '#{client_name}'" }
bind -N "Go to agent 7" M-7 if -F "#{@space_hidden}" { run-shell -b "#{@notify_sh} -k warn -c '#{client_name}' -- 'space: not a space'" } { run-shell -b "#{@space_sh} agent 7 '#{session_id}' '#{client_name}'" }
bind -N "Go to agent 8" M-8 if -F "#{@space_hidden}" { run-shell -b "#{@notify_sh} -k warn -c '#{client_name}' -- 'space: not a space'" } { run-shell -b "#{@space_sh} agent 8 '#{session_id}' '#{client_name}'" }
bind -N "Go to agent 9" M-9 if -F "#{@space_hidden}" { run-shell -b "#{@notify_sh} -k warn -c '#{client_name}' -- 'space: not a space'" } { run-shell -b "#{@space_sh} agent 9 '#{session_id}' '#{client_name}'" }
# Option-L / Option-H are kind-aware (space.sh decides): on an agent they
# cycle this space's agents, on a shell its shells.
bind -n M-l if -F "#{@space_hidden}" { run-shell -b "#{@notify_sh} -k warn -c '#{client_name}' -- 'space: not a space'" } { run-shell -b "#{@space_sh} next '#{session_id}' '#{client_name}'" }
bind -n M-h if -F "#{@space_hidden}" { run-shell -b "#{@notify_sh} -k warn -c '#{client_name}' -- 'space: not a space'" } { run-shell -b "#{@space_sh} prev '#{session_id}' '#{client_name}'" }
bind -n M-` if -F "#{@space_hidden}" { run-shell -b "#{@notify_sh} -k warn -c '#{client_name}' -- 'space: not a space'" } { run-shell -b "#{@space_sh} toggle '#{session_id}' '#{client_name}'" }
bind -n M-n run-shell -C "display-popup -c '#{client_tty}' -E -w 80% -h 70% -x '##{E:@popup_x}' -d '#{pane_current_path}' \"#{@space_sh} new-space '#{client_tty}'\""
# Option-M → move this tab to another space: a menu of the spaces, each with
# its number as the key; the tab goes to the end of that space and you stay
# here. Not from a hidden session, not the home window.
# The WezTerm chords (User keys, above the %if): the same three rows, each
# one key. CTRL+N (User0..8) is prefix N, CMD+N (User18..26) prefix M-N; OPT+N
# (User9..17) is M-N sent on to the pane, exactly as with spaces off. The
# prefix bindings above stay for any other terminal.
bind -n User0 run-shell -C "#{?#{S:#{?#{==:#{@space_index},1},1,}},switch-client -t '#{s/ .*//:#{S:#{?#{==:#{@space_index},1},#{session_id}#{W:#{?#{@space_home},:#{window_id} ,}},}}}',run-shell -b '#{@notify_sh} -k warn -c \"#{client_name}\" -- \"no space 1\"'}"
bind -n User1 run-shell -C "#{?#{S:#{?#{==:#{@space_index},2},1,}},switch-client -t '#{s/ .*//:#{S:#{?#{==:#{@space_index},2},#{session_id}#{W:#{?#{@space_home},:#{window_id} ,}},}}}',run-shell -b '#{@notify_sh} -k warn -c \"#{client_name}\" -- \"no space 2\"'}"
bind -n User2 run-shell -C "#{?#{S:#{?#{==:#{@space_index},3},1,}},switch-client -t '#{s/ .*//:#{S:#{?#{==:#{@space_index},3},#{session_id}#{W:#{?#{@space_home},:#{window_id} ,}},}}}',run-shell -b '#{@notify_sh} -k warn -c \"#{client_name}\" -- \"no space 3\"'}"
bind -n User3 run-shell -C "#{?#{S:#{?#{==:#{@space_index},4},1,}},switch-client -t '#{s/ .*//:#{S:#{?#{==:#{@space_index},4},#{session_id}#{W:#{?#{@space_home},:#{window_id} ,}},}}}',run-shell -b '#{@notify_sh} -k warn -c \"#{client_name}\" -- \"no space 4\"'}"
bind -n User4 run-shell -C "#{?#{S:#{?#{==:#{@space_index},5},1,}},switch-client -t '#{s/ .*//:#{S:#{?#{==:#{@space_index},5},#{session_id}#{W:#{?#{@space_home},:#{window_id} ,}},}}}',run-shell -b '#{@notify_sh} -k warn -c \"#{client_name}\" -- \"no space 5\"'}"
bind -n User5 run-shell -C "#{?#{S:#{?#{==:#{@space_index},6},1,}},switch-client -t '#{s/ .*//:#{S:#{?#{==:#{@space_index},6},#{session_id}#{W:#{?#{@space_home},:#{window_id} ,}},}}}',run-shell -b '#{@notify_sh} -k warn -c \"#{client_name}\" -- \"no space 6\"'}"
bind -n User6 run-shell -C "#{?#{S:#{?#{==:#{@space_index},7},1,}},switch-client -t '#{s/ .*//:#{S:#{?#{==:#{@space_index},7},#{session_id}#{W:#{?#{@space_home},:#{window_id} ,}},}}}',run-shell -b '#{@notify_sh} -k warn -c \"#{client_name}\" -- \"no space 7\"'}"
bind -n User7 run-shell -C "#{?#{S:#{?#{==:#{@space_index},8},1,}},switch-client -t '#{s/ .*//:#{S:#{?#{==:#{@space_index},8},#{session_id}#{W:#{?#{@space_home},:#{window_id} ,}},}}}',run-shell -b '#{@notify_sh} -k warn -c \"#{client_name}\" -- \"no space 8\"'}"
bind -n User8 run-shell -C "#{?#{S:#{?#{==:#{@space_index},9},1,}},switch-client -t '#{s/ .*//:#{S:#{?#{==:#{@space_index},9},#{session_id}#{W:#{?#{@space_home},:#{window_id} ,}},}}}',run-shell -b '#{@notify_sh} -k warn -c \"#{client_name}\" -- \"no space 9\"'}"
bind -n User9 send-keys M-1
bind -n User10 send-keys M-2
bind -n User11 send-keys M-3
bind -n User12 send-keys M-4
bind -n User13 send-keys M-5
bind -n User14 send-keys M-6
bind -n User15 send-keys M-7
bind -n User16 send-keys M-8
bind -n User17 send-keys M-9
bind -n User18 if -F "#{@space_hidden}" { run-shell -b "#{@notify_sh} -k warn -c '#{client_name}' -- 'space: not a space'" } { run-shell -b "#{@space_sh} agent 1 '#{session_id}' '#{client_name}'" }
bind -n User19 if -F "#{@space_hidden}" { run-shell -b "#{@notify_sh} -k warn -c '#{client_name}' -- 'space: not a space'" } { run-shell -b "#{@space_sh} agent 2 '#{session_id}' '#{client_name}'" }
bind -n User20 if -F "#{@space_hidden}" { run-shell -b "#{@notify_sh} -k warn -c '#{client_name}' -- 'space: not a space'" } { run-shell -b "#{@space_sh} agent 3 '#{session_id}' '#{client_name}'" }
bind -n User21 if -F "#{@space_hidden}" { run-shell -b "#{@notify_sh} -k warn -c '#{client_name}' -- 'space: not a space'" } { run-shell -b "#{@space_sh} agent 4 '#{session_id}' '#{client_name}'" }
bind -n User22 if -F "#{@space_hidden}" { run-shell -b "#{@notify_sh} -k warn -c '#{client_name}' -- 'space: not a space'" } { run-shell -b "#{@space_sh} agent 5 '#{session_id}' '#{client_name}'" }
bind -n User23 if -F "#{@space_hidden}" { run-shell -b "#{@notify_sh} -k warn -c '#{client_name}' -- 'space: not a space'" } { run-shell -b "#{@space_sh} agent 6 '#{session_id}' '#{client_name}'" }
bind -n User24 if -F "#{@space_hidden}" { run-shell -b "#{@notify_sh} -k warn -c '#{client_name}' -- 'space: not a space'" } { run-shell -b "#{@space_sh} agent 7 '#{session_id}' '#{client_name}'" }
bind -n User25 if -F "#{@space_hidden}" { run-shell -b "#{@notify_sh} -k warn -c '#{client_name}' -- 'space: not a space'" } { run-shell -b "#{@space_sh} agent 8 '#{session_id}' '#{client_name}'" }
bind -n User26 if -F "#{@space_hidden}" { run-shell -b "#{@notify_sh} -k warn -c '#{client_name}' -- 'space: not a space'" } { run-shell -b "#{@space_sh} agent 9 '#{session_id}' '#{client_name}'" }
bind -n M-m if -F "#{||:#{@space_hidden},#{@space_home}}" { run-shell -b "#{@notify_sh} -k warn -c '#{client_name}' -- 'space: only a tab of a space moves'" } { run-shell -b "#{@space_sh} move-menu '#{window_id}' '#{client_name}'" }

# prefix Q → close this space for good, after a y/n that says what dies.
# Every tab goes through closed-tabs.sh first (CMD+Z can bring each back),
# then the session is killed and dropped from the registry. Never main.
set -g @space_n_agents '#{n:#{W:#{?#{@agent_state},x,}}}'
set -g @space_n_shells '#{n:#{W:#{?#{@agent_state},,x}}}'
set -g @space_close_prompt 'close space #{session_name}: #{E:@space_n_agents} agent#{?#{==:#{E:@space_n_agents},1},,s}, #{E:@space_n_shells} shell#{?#{==:#{E:@space_n_shells},1},,s}?'
bind -N "Close this space" Q if -F "#{||:#{@space_hidden},#{==:#{session_name},main}}" { run-shell -b "#{@notify_sh} -k warn -c '#{client_name}' -- 'space: main and hidden sessions are never closed'" } { display-menu -b rounded -s 'bg=#1e1e2e,fg=#cdd6f4' -S 'fg=#f38ba8' -H 'bg=#45475a,fg=#cdd6f4,bold' -T "#[align=centre] #{E:@space_close_prompt} " -x '#{E:@popup_x}' -y C "Cancel" n "" "Close space" y "run-shell -b \"#{@space_sh} close '#{session_id}' '#{client_name}'\"" }

# The home shell is never closed by hand: it is what keeps the space alive
# when its last tab closes (as the last window, closing it would end the
# space with no y/n). CMD+W (x) and CMD+SHIFT+W (C-l) on the home PANE refuse
# and point at prefix Q; on any other pane, a split inside the home window
# included, they are exactly tmux.conf's bindings. Its shell
# exiting (`exit`, Ctrl-D) respawns it: the pane-died hook above the %if.
# The home's dashboard pane is refused the same way (it never holds the
# focus, but a binding run with -t could still aim at it).
bind x if -F "#{||:#{@space_home_pane},#{@space_dash_pane}}" { run-shell -b "#{@notify_sh} -k warn -c '#{client_name}' -- \"space: #{?#{@space_dash_pane},the home dashboard stays,home is this space's main shell} · prefix Q closes the space\"" } { display-menu -b rounded -s 'bg=#1e1e2e,fg=#cdd6f4' -S 'fg=#f38ba8' -H 'bg=#45475a,fg=#cdd6f4,bold' -T "#{E:@close_title}" -x '#{E:@popup_x}' -y C "Cancel" n "" "Close" y "run-shell -b '#{HOME}/.config/tmux/scripts/closed-tabs.sh close #{pane_id}'" }
bind C-l if -F "#{||:#{@space_home_pane},#{@space_dash_pane}}" { run-shell -b "#{@notify_sh} -k warn -c '#{client_name}' -- \"space: #{?#{@space_dash_pane},the home dashboard stays,home is this space's main shell} · prefix Q closes the space\"" } { run-shell -b "#{HOME}/.config/tmux/scripts/closed-tabs.sh close '#{pane_id}'" }

# prefix a / C-a (the session picker) belong to the pre-spaces bar: spaces
# are the sessions now. tmux.conf binds them on every load, before this file,
# so the off path needs no copy; `prefix r` after `@spaces off` brings them back.
unbind -q a
unbind -q C-a
# Option-V: the sidebar's scope, this space <-> all spaces. The sidebar's own
# Option-V is rarely reachable (clicks hand focus straight back to tmux), so
# the key lives here. Unset @strip_scope means "space" while spaces are on.
# The notifyutil post makes the Rust sidebar redraw at once.
bind -n M-v if -F "#{==:#{?#{@strip_scope},#{@strip_scope},space},space}" { set -g @strip_scope all ; run-shell -b "#{@notify_sh} -k info -c '#{client_name}' -- 'sidebar: all spaces'" } { set -g @strip_scope space ; run-shell -b "#{@notify_sh} -k info -c '#{client_name}' -- 'sidebar: this space'" } \; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus"
# prefix t: pin / unpin THIS tab in the agent sidebar's PINNED section
# (docs/agent-roster.md "Pinned agents"). `agent-ui pin` sets or clears the
# window's @agent_pinned (an agent only: a shell or a home is refused, by
# notify.sh), keeps the pin in ~/.local/state/agent-ui/pins.json so a restore
# or a ⌘Z reopen gets it back, posts the agent-state notice (every sidebar
# redraws at once) and says `pinned <title>`. It takes tmux's clock-mode
# (t; given back with spaces off). Not prefix p: that sits next to prefix P,
# which pauses every agent at once.
set -g @space_pin 'B="#{@space_agent_ui}"; if [ -x "$B" ]; then "$B" pin toggle --window "#{window_id}" --client "#{client_name}"; else #{@notify_sh} -k warn -c "#{client_name}" -- "pin: agent-ui is not installed"; fi; true'
bind -N "Pin or unpin this agent in the sidebar" t run-shell -b "#{E:@space_pin}"

# Option-W: the jump leader, for agents AND shells. It arms the key table
# `jump`; the next lowercase letter goes to the window whose option
# @agent_key is that letter, in ANY space: an agent or a non-home shell, which
# draw their letters from one pool (the sidebar assigns them; this only reads
# them): switch-client to its session and window in one step. A home window
# never matches, even with a stale @agent_key: homes are reached by ⌃N, never
# by a letter. Escape or any other key (`Any`) cancels and is
# swallowed, never typed into the pane. Entering and leaving the table post
# com.mackhaymond.tmux.focus, so the sidebar can show "jump mode" (it reads
# #{client_key_table}). No fork: the S:/W: loop finds the window, hidden
# sessions (agents, stash, ...) are skipped before their W: runs, and
# #{s/ .*//:} keeps the first match should two windows share a letter. The
# letter rides in the global @space_jump_key (set, then read, in the same
# command list).
# M-w was the Option-W agent menu (tmux.conf binds it on every load, before
# this file); with spaces on the leader takes it (Mack, 2026-10-15: the menu
# is on hold, prefix q still opens it). With spaces off tmux.conf's menu
# binding stands. M-f (the leader's first key) goes back to the pane: zsh's
# forward-word and Claude Code's meta+f.
unbind -q -n M-f
set -g @space_jump_hit '#{s/ .*//:#{S:#{?#{@space_hidden},,#{W:#{?#{&&:#{==:#{@agent_key},#{@space_jump_key}},#{!:#{@space_home}}},#{session_id}:#{window_id} ,}}}}}'
set -g @space_jump_go "#{?#{E:@space_jump_hit},switch-client -t '#{E:@space_jump_hit}',run-shell -b '#{@notify_sh} -k warn -c \"#{client_name}\" -- \"jump: nothing on #{@space_jump_key}\"'}"
bind -n M-w switch-client -T jump \; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus"
bind -T jump a { set -g @space_jump_key a ; run-shell -C "#{E:@space_jump_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
bind -T jump b { set -g @space_jump_key b ; run-shell -C "#{E:@space_jump_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
bind -T jump c { set -g @space_jump_key c ; run-shell -C "#{E:@space_jump_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
bind -T jump d { set -g @space_jump_key d ; run-shell -C "#{E:@space_jump_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
bind -T jump e { set -g @space_jump_key e ; run-shell -C "#{E:@space_jump_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
bind -T jump f { set -g @space_jump_key f ; run-shell -C "#{E:@space_jump_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
bind -T jump g { set -g @space_jump_key g ; run-shell -C "#{E:@space_jump_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
bind -T jump h { set -g @space_jump_key h ; run-shell -C "#{E:@space_jump_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
bind -T jump i { set -g @space_jump_key i ; run-shell -C "#{E:@space_jump_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
bind -T jump j { set -g @space_jump_key j ; run-shell -C "#{E:@space_jump_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
bind -T jump k { set -g @space_jump_key k ; run-shell -C "#{E:@space_jump_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
bind -T jump l { set -g @space_jump_key l ; run-shell -C "#{E:@space_jump_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
bind -T jump m { set -g @space_jump_key m ; run-shell -C "#{E:@space_jump_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
bind -T jump n { set -g @space_jump_key n ; run-shell -C "#{E:@space_jump_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
bind -T jump o { set -g @space_jump_key o ; run-shell -C "#{E:@space_jump_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
bind -T jump p { set -g @space_jump_key p ; run-shell -C "#{E:@space_jump_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
bind -T jump q { set -g @space_jump_key q ; run-shell -C "#{E:@space_jump_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
bind -T jump r { set -g @space_jump_key r ; run-shell -C "#{E:@space_jump_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
bind -T jump s { set -g @space_jump_key s ; run-shell -C "#{E:@space_jump_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
bind -T jump t { set -g @space_jump_key t ; run-shell -C "#{E:@space_jump_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
bind -T jump u { set -g @space_jump_key u ; run-shell -C "#{E:@space_jump_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
bind -T jump v { set -g @space_jump_key v ; run-shell -C "#{E:@space_jump_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
bind -T jump w { set -g @space_jump_key w ; run-shell -C "#{E:@space_jump_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
bind -T jump x { set -g @space_jump_key x ; run-shell -C "#{E:@space_jump_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
bind -T jump y { set -g @space_jump_key y ; run-shell -C "#{E:@space_jump_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
bind -T jump z { set -g @space_jump_key z ; run-shell -C "#{E:@space_jump_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
# ⌥W then a DIGIT N: the Nth PINNED agent (the agent sidebar's PINNED
# section, in pin order; docs/agent-roster.md "Pinned agents"), in any space.
# The sidebar (and every pin toggle) keeps each pinned window's @pin_key at
# 1..N in pin order with no gap; this only reads them, the letters' way: the
# digit rides in the global @space_pin_n, an S:/W: loop finds the window whose
# @pin_key it is AND that is still a pinned agent (@agent_pinned and a
# non-empty @agent_state: an agent that exited keeps a stale key until the
# sidebar's next refresh), never a home, hidden sessions (the stash among
# them) skipped before their W: runs, #{s/ .*//:} keeping the first match.
# No fork on a hit. A miss renumbers the pins (`agent-ui pin renumber`, so a
# gap no sidebar repaired is gone for the next press) and says "no pin N".
set -g @space_pin_hit '#{s/ .*//:#{S:#{?#{@space_hidden},,#{W:#{?#{&&:#{==:#{@pin_key},#{@space_pin_n}},#{&&:#{@agent_pinned},#{&&:#{@agent_state},#{!:#{@space_home}}}}},#{session_id}:#{window_id} ,}}}}}'
set -g @space_pin_miss 'B="#{@space_agent_ui}"; if [ -x "$B" ]; then "$B" pin renumber; fi; #{@notify_sh} -k warn -c "#{client_name}" -- "no pin #{@space_pin_n}"'
set -g @space_pin_go "#{?#{E:@space_pin_hit},switch-client -t '#{E:@space_pin_hit}',run-shell -b '#{E:@space_pin_miss}'}"
bind -T jump 1 { set -g @space_pin_n 1 ; run-shell -C "#{E:@space_pin_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
bind -T jump 2 { set -g @space_pin_n 2 ; run-shell -C "#{E:@space_pin_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
bind -T jump 3 { set -g @space_pin_n 3 ; run-shell -C "#{E:@space_pin_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
bind -T jump 4 { set -g @space_pin_n 4 ; run-shell -C "#{E:@space_pin_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
bind -T jump 5 { set -g @space_pin_n 5 ; run-shell -C "#{E:@space_pin_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
bind -T jump 6 { set -g @space_pin_n 6 ; run-shell -C "#{E:@space_pin_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
bind -T jump 7 { set -g @space_pin_n 7 ; run-shell -C "#{E:@space_pin_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
bind -T jump 8 { set -g @space_pin_n 8 ; run-shell -C "#{E:@space_pin_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
bind -T jump 9 { set -g @space_pin_n 9 ; run-shell -C "#{E:@space_pin_go}" ; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus" }
bind -T jump Escape run-shell -b "notifyutil -p com.mackhaymond.tmux.focus"
bind -T jump Any run-shell -b "notifyutil -p com.mackhaymond.tmux.focus"

# New tabs in a PROJECT space (session_path is not ~, not hidden) start in the
# space's folder; everywhere else they keep today's directory. Same keys and
# shapes as the bindings at the top of tmux.conf.
bind c new-window -a -c "#{?#{||:#{@space_hidden},#{==:#{session_path},#{HOME}}},#{pane_current_path},#{session_path}}"
bind k new-window -a -c "#{?#{||:#{@space_hidden},#{==:#{session_path},#{HOME}}},#{pane_current_path},#{session_path}}" -e ZSH_AUTOSTART=claude \; run-shell -C "#{?@agent_birth,#{@agent_birth} claude,}"
# C-k replaces the current tab; on home it only adds one (home stays).
bind C-k if -F "#{@space_home}" { new-window -a -c "#{session_path}" -e ZSH_AUTOSTART=claude ; run-shell -C "#{?@agent_birth,#{@agent_birth} claude,}" } { new-window -a -c "#{?#{||:#{@space_hidden},#{==:#{session_path},#{HOME}}},#{pane_current_path},#{session_path}}" -e ZSH_AUTOSTART=claude ; run-shell -C "#{?@agent_birth,#{@agent_birth} claude,}" ; kill-window -t - }
# CMD+SHIFT+T (prefix C-t) / CMD+SHIFT+R (prefix K) ask WHICH SPACE, not which
# folder: a popup (space.sh pick-tab) lists the spaces in ⌃N order (this one
# marked, still a pick), then zoxide's folders that are not a space yet. A
# space gets a new shell / claude tab at its end, at its folder, and you go to
# it; a folder (listed or typed) opens its space first (made if new; a new
# space's shell is its home, no second one). Esc does nothing. The claude tab
# is an agent from birth (space.sh runs @agent_birth in its new-window's
# command list). The popup is opened as Option-N's is.
bind C-t run-shell -C "display-popup -c '#{client_tty}' -E -w 80% -h 70% -x '##{E:@popup_x}' -d '#{pane_current_path}' \"#{@space_sh} pick-tab shell '#{client_tty}'\""
bind K run-shell -C "display-popup -c '#{client_tty}' -E -w 80% -h 70% -x '##{E:@popup_x}' -d '#{pane_current_path}' \"#{@space_sh} pick-tab agent '#{client_tty}'\""

# Last-visited agent and shell of each space (window ids, session options),
# for Option-`. Same two hooks, for the same reasons, as the @agent_mru_*
# block in tmux.conf ([0]-[2] are taken there). Pure set -F, no fork.
set-hook -g 'session-window-changed[20]' {
  set -F @space_last_agent "#{?#{n:#{@agent_state}},#{window_id},#{@space_last_agent}}"
  set -F @space_last_shell "#{?#{n:#{@agent_state}},#{@space_last_shell},#{window_id}}"
}
set-hook -g 'client-session-changed[20]' {
  set -F @space_last_agent "#{?#{n:#{@agent_state}},#{window_id},#{@space_last_agent}}"
  set -F @space_last_shell "#{?#{n:#{@agent_state}},#{@space_last_shell},#{window_id}}"
}

# A window closed: if it was a home (killed some way the keys above don't
# guard, e.g. prefix &), sync makes a new one. A window opened: if it landed
# before home (closed-tabs reopens with -b), sync moves home back in front,
# so home stays the space's first window. Gated on the HOOK's session (not
# the client's, which may be elsewhere or absent), never for hidden ones:
# agents churns.
set-hook -g 'window-unlinked[20]' { if -F "#{?#{m:* #{hook_session_name} *, #{@space_hidden_sessions} },,1}" { run-shell -b "#{@space_sh} sync" } }
set-hook -g 'window-linked[20]' { if -F "#{?#{m:* #{hook_session_name} *, #{@space_hidden_sessions} },,1}" { run-shell -b "#{@space_sh} sync" } }

