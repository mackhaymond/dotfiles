# SPACES — sourced from the bottom of tmux.conf. Design: docs/spaces.md.
#
# A space is a tmux session; an agent is a window with a non-empty
# @agent_state (the agent-tab indicator sets it for every live claude/codex
# window, idle included); every other window is a shell.
#
# This file is separate from tmux.conf for one reason: `%if` is evaluated when
# a file is PARSED, before any of its commands run, so a `%if` on @spaces in
# tmux.conf would see the value from the previous load (empty on a cold
# start). tmux.conf sets @spaces and then source-files this, by which time the
# set has run.
#
# @spaces off + reload restores today's keys and status line exactly: every
# `%else` line below undoes its `%if` twin (tests/test_spaces.py checks the
# round trip against a fresh server).
#
# Needs from tmux.conf: @spaces, @space_hidden_sessions.

# The logic script. Tests point this at the chezmoi source copy.
set -gF @space_sh "#{?@space_sh,#{@space_sh},#{HOME}/.config/tmux/scripts/space.sh}"

# ── hidden sessions: marked whatever the flag says ──────────────────────────
# @space_hidden 1 on every session named in @space_hidden_sessions, at birth
# (pure tmux, so a status line never flashes one) and again by `space.sh sync`,
# which also numbers the visible sessions (@space_index: main = 1, then the
# registry's order) for the space tabs and prefix 1-9. Rename and close
# renumber. With @spaces on, sync also keeps one home window per space and
# the registry (docs/spaces.md); `sync load` at config load recreates
# registered spaces that are missing. Index [20]: [90] belongs to tmux-mcp's
# poke hooks.
set-hook -g 'session-created[20]' {
  if -F "#{m:* #{session_name} *, #{@space_hidden_sessions} }" { set @space_hidden 1 }
  run-shell -b "#{@space_sh} sync"
}
set-hook -g 'session-closed[20]' 'run-shell -b "#{@space_sh} sync"'
set-hook -g 'session-renamed[20]' 'run-shell -b "#{@space_sh} sync"'
run-shell -b "#{@space_sh} sync load"

# A home shell (docs/spaces.md) that exits is respawned in place: the home
# PANE (@space_home_pane; other panes split into the home window are
# ordinary) carries remain-on-exit, so it stays (dead) and this hook fires.
# Not gated on @spaces: a home made while on must not turn into a dead pane
# when the flag goes off.
set-hook -g 'pane-died[20]' { if -F "#{@space_home_pane}" { run-shell -b "#{@space_sh} respawn-home '#{pane_id}'" } }

# ── the digit chords: one private sequence each ─────────────────────────────
# WezTerm (wezterm.lua.tmpl, the last loop) sends every digit chord as its own
# escape sequence, which tmux reads as ONE key, User0..User26:
#   CTRL+N  \e[911N~  User0..User8    space N   (off: window N)
#   OPT+N   \e[912N~  User9..User17   shell N   (off: M-N to the pane, as before)
#   CMD+N   \e[913N~  User18..User26  agent N   (off: window N)
# One key per chord, so nothing hangs on timing or on a stray modifier: CMD+N
# used to send the prefix and then ESC N, the very bytes of Option+N, so a
# dropped prefix or a touched Option made it "shell N". The mixed chords
# (CMD+OPT+N, CMD+CTRL+N, CTRL+OPT+N, CMD+SHIFT+N) are swallowed in WezTerm.
# No real terminal sends CSI 9111-9139 ~. Set whatever @spaces says: the User
# bindings in the two branches below decide what each one does.
set -s user-keys[0] "\e[9111~"
set -s user-keys[1] "\e[9112~"
set -s user-keys[2] "\e[9113~"
set -s user-keys[3] "\e[9114~"
set -s user-keys[4] "\e[9115~"
set -s user-keys[5] "\e[9116~"
set -s user-keys[6] "\e[9117~"
set -s user-keys[7] "\e[9118~"
set -s user-keys[8] "\e[9119~"
set -s user-keys[9] "\e[9121~"
set -s user-keys[10] "\e[9122~"
set -s user-keys[11] "\e[9123~"
set -s user-keys[12] "\e[9124~"
set -s user-keys[13] "\e[9125~"
set -s user-keys[14] "\e[9126~"
set -s user-keys[15] "\e[9127~"
set -s user-keys[16] "\e[9128~"
set -s user-keys[17] "\e[9129~"
set -s user-keys[18] "\e[9131~"
set -s user-keys[19] "\e[9132~"
set -s user-keys[20] "\e[9133~"
set -s user-keys[21] "\e[9134~"
set -s user-keys[22] "\e[9135~"
set -s user-keys[23] "\e[9136~"
set -s user-keys[24] "\e[9137~"
set -s user-keys[25] "\e[9138~"
set -s user-keys[26] "\e[9139~"

%if "#{==:#{@spaces},on}"

# ── status: ONE line = this space, other spaces that need you, its shells ──
# The full list of spaces, with their ⌃N numbers, lives in the sidebar; the
# status line names only the space you are in, plus a dot for any other space
# with an agent that needs you.
#
# THIS SPACE: a catppuccin-style tab, `⌃N name`, with the space's ROLLUP as
# its state (the most urgent agent among its windows). The label is the
# session option @space_key, the key that reaches the space (`space.sh sync`
# sets it with @space_index: ⌃N, Ctrl+N being space N), so a different key
# scheme changes one line of space.sh, not this format. A space with no key
# (past 9) keeps a bare chip, which still turns red on the prefix; its alert
# shows its name instead of a key.
#   CHIP   ⌃N; peach, crust under a tint, RED while the prefix is pressed
#          (what catppuccin's session module, gone while spaces are on, said)
#   BODY   red failed > yellow needs-* > green done (done+workflow does not
#          count, as on the window tab), else stock
#   GLYPH  󰒓 any background workflow, else 󰍽 any computer use
# OTHER SPACES THAT NEED YOU: `⌃N●` in red / yellow / green, the same three
# states prefix d walks (agent-jump.sh); in-flight and idle spaces never show.
# Each is a session range, so a click switches (tmux's own switch-client -t =).
# One S: loop, in name order; hidden sessions are never looped into (agents
# has hundreds of windows): the #{?#{@space_hidden},,…} guard skips them
# before any W: runs. No #() anywhere: this redraws every second while the
# watcher blinks.
set -g @space_fail '#{W:#{?#{==:#{@agent_state},failed},1,}}'
set -g @space_need '#{W:#{?#{m:needs-*,#{@agent_state}},1,}}'
set -g @space_done '#{W:#{?#{&&:#{==:#{@agent_state},done},#{!:#{@agent_workflow}}},1,}}'
set -g @space_wf '#{W:#{?#{@agent_workflow},1,}}'
set -g @space_cua '#{W:#{?#{@agent_cua},1,}}'
set -g @space_cur '#{==:#{session_name},#{client_session}}'
set -g @space_hot '#{||:#{E:@space_fail},#{||:#{E:@space_need},#{E:@space_done}}}'
set -g @space_bg '#{?#{E:@space_fail},#f38ba8,#{?#{E:@space_need},#f9e2af,#{?#{E:@space_done},#a6e3a1,#1e1e2e}}}'
set -g @space_ink '#{?#{E:@space_hot},#11111b,#cdd6f4}'
set -g @space_glyph '#{?#{E:@space_wf},#[fg=#{?#{E:@space_hot},#11111b,#{?#{@agent_blink},#94e2d5,#659a91}}]󰒓 ,#{?#{E:@space_cua},#[fg=#{?#{E:@space_hot},#11111b,#{?#{@agent_blink},#89b4fa,#5d7aaa}}]󰍽 ,}}'
set -g @space_chip '#{?client_prefix,#f38ba8,#{?#{E:@space_hot},#11111b,#fab387}}'
set -g @space_num '#{?client_prefix,#11111b,#{E:@space_bg}}'
set -g @space_here '#[range=session|#{session_id}]#[fg=#{E:@space_chip},bg=default]█#[fg=#{E:@space_num},bg=#{E:@space_chip}]#{@space_key}#[fg=#{E:@space_chip},bg=#{E:@space_bg}]█ #{E:@space_glyph}#[fg=#{E:@space_ink}]#{session_name}#[fg=#{E:@space_bg},bg=default]█#[norange default]'
set -g @space_alert ' #[range=session|#{session_id}]#[fg=#{?#{E:@space_fail},#f38ba8,#{?#{E:@space_need},#f9e2af,#a6e3a1}}]#{?#{@space_key},#{@space_key},#{session_name}}●#[norange default]'
set -g @space_alerts '#{S:#{?#{@space_hidden},,#{?#{E:@space_cur},,#{?#{E:@space_hot},#{E:@space_alert},}}}}'

# A shell tab: stock catppuccin colours (peach chip when it is the window you
# are on), numbered by its ORDINAL among this space's shells (1, 2, 3 ... in
# tab order, agents skipped; Option-N goes to shell N), and labelled with its
# folder while a shell sits at the prompt, else with what runs in it (nvim,
# nu, ...). The home shell (@space_home, always the lowest window, so shell 1)
# wears a 󰋜 before its label.
# The ordinal: a W: loop counting the shells at or before this one. A nested
# loop cannot see the outer window's index, so @space_shell_ord is expanded
# twice (#{E:#{E:...}}): the first pass, in the outer window, bakes its index
# in and turns ## into #; the second runs the inner loop.
set -g @space_shell_ord '##{n:##{W:##{?##{&&:##{e|<=:##{window_index},#{window_index}},##{!:##{@agent_state}}},x,}}}'
set -g @space_shell_label '#{?#{@space_home},󰋜 ,}#{?#{m/r:^-?(zsh|bash|sh|fish)$,#{pane_current_command}},#{?#{==:#{pane_current_path},#{HOME}},~,#{b:pane_current_path}},#{pane_current_command}}'
set -g @space_shell '#[range=window|#{window_index}]#[fg=#{?window_active,#fab387,#89b4fa},bg=default]█#[fg=#{?window_active,#1e1e2e,#313244},bg=#{?window_active,#fab387,#89b4fa}]#{E:#{E:@space_shell_ord}}#[fg=#{?window_active,#fab387,#89b4fa},bg=#{?window_active,#1e1e2e,#313244}]█ #[fg=#cdd6f4]#{E:@space_shell_label}#[fg=#{?window_active,#1e1e2e,#313244},bg=default]█#[norange default]'

# After the chips: this space's shells, then a [+] that opens a new one at
# the space's folder (MouseDown1Status below). Nothing is looped in a hidden
# session; there the line starts with its name, dimmed, so you know where
# you are (the other spaces' alerts still show).
#
# EXCEPT while a stash range selection (prefix v; scripts/stash.sh sel-*) is
# live in this space. Its only feedback is the @stash_sel tint on window tabs,
# and with spaces on the agents have no tab. So while any window here carries
# @stash_sel, the shells give way to EVERY window of the space as today's
# catppuccin tab (window-status-format / -current-format, which hold the mauve
# @stash_sel tint and the agent tints) — the pre-spaces bar, for the length of
# the gesture. stash.sh flags the starting tab at once, clears the flag on
# commit/cancel and refreshes the client on every step, so the presence of
# the flag IS the "selection active" marker; nothing extra is needed.
set -g @space_sel_tabs '#{W:#[range=window|#{window_index}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default],#[range=window|#{window_index}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange default]}'
set -g @space_shell_tabs '#{W:#{?#{@agent_state},,#{E:@space_shell}}}#[range=user|space-new]#[fg=#6c7086] [+] #[norange default]'

# One line: status-left as today, this space's tab (or a hidden session's
# dimmed name), the alerts, a space, the shells; and on the right today's
# status-right, which loses only catppuccin's `session` module while spaces
# are on (tmux.conf builds @catppuccin_status_modules_right from @spaces; the
# space tab names the session now). `set -gu` first drops any line 1 a
# two-line config left behind.
# A hidden session's name: dimmed, or crust on red while the prefix is
# pressed, as the space tab's chip (the commas in a #{?} branch are #,).
set -g @space_hidden_tag '#{?client_prefix,#[fg=#11111b#,bg=#f38ba8],#[fg=#6c7086]}[#{session_name}]#[default]'
set -g status on
set -gu status-format
set -g 'status-format[0]' '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[align=left]#{?#{@space_hidden},#{E:@space_hidden_tag},#{E:@space_here}}#{E:@space_alerts}#{?#{@space_hidden},, #{?#{W:#{?#{@stash_sel},1,}},#{E:@space_sel_tabs},#{E:@space_shell_tabs}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'

# Clicks: a space tab is a session range and a shell tab a window range, which
# tmux's own `switch-client -t =` already handles; only [+] is ours.
bind -n MouseDown1Status if -F "#{==:#{mouse_status_range},space-new}" { new-window -a -t "{end}" -c "#{session_path}" } { switch-client -t = }

# ── keys ────────────────────────────────────────────────────────────────────
# The digit rows (WezTerm sends the prefix ones; wezterm.lua.tmpl):
#   Control-1..9  prefix 1-9      space N, in tab order
#   Option-1..9   M-1..M-9        shell N of this space (home = 1)
#   Command-1..9  prefix M-1..9   agent N of this space
# prefix 1-9: no fork, an S: loop finds the session whose @space_index is N.
bind -N "Go to space 1" 1 run-shell -C "#{?#{S:#{?#{==:#{@space_index},1},1,}},switch-client -t '#{S:#{?#{==:#{@space_index},1},#{session_id},}}',display-message 'no space 1'}"
bind -N "Go to space 2" 2 run-shell -C "#{?#{S:#{?#{==:#{@space_index},2},1,}},switch-client -t '#{S:#{?#{==:#{@space_index},2},#{session_id},}}',display-message 'no space 2'}"
bind -N "Go to space 3" 3 run-shell -C "#{?#{S:#{?#{==:#{@space_index},3},1,}},switch-client -t '#{S:#{?#{==:#{@space_index},3},#{session_id},}}',display-message 'no space 3'}"
bind -N "Go to space 4" 4 run-shell -C "#{?#{S:#{?#{==:#{@space_index},4},1,}},switch-client -t '#{S:#{?#{==:#{@space_index},4},#{session_id},}}',display-message 'no space 4'}"
bind -N "Go to space 5" 5 run-shell -C "#{?#{S:#{?#{==:#{@space_index},5},1,}},switch-client -t '#{S:#{?#{==:#{@space_index},5},#{session_id},}}',display-message 'no space 5'}"
bind -N "Go to space 6" 6 run-shell -C "#{?#{S:#{?#{==:#{@space_index},6},1,}},switch-client -t '#{S:#{?#{==:#{@space_index},6},#{session_id},}}',display-message 'no space 6'}"
bind -N "Go to space 7" 7 run-shell -C "#{?#{S:#{?#{==:#{@space_index},7},1,}},switch-client -t '#{S:#{?#{==:#{@space_index},7},#{session_id},}}',display-message 'no space 7'}"
bind -N "Go to space 8" 8 run-shell -C "#{?#{S:#{?#{==:#{@space_index},8},1,}},switch-client -t '#{S:#{?#{==:#{@space_index},8},#{session_id},}}',display-message 'no space 8'}"
bind -N "Go to space 9" 9 run-shell -C "#{?#{S:#{?#{==:#{@space_index},9},1,}},switch-client -t '#{S:#{?#{==:#{@space_index},9},#{session_id},}}',display-message 'no space 9'}"

# Option-1..9 → shell N of this space; Command-1..9 (prefix M-1..9) → agent
# N (the agent sidebar numbers agents the same way). Option-L / Option-H →
# next / previous of the same kind (NOT M-j/M-k: Claude Code binds meta+j to
# app:toggleTerminal). Option-` → agent <-> last shell of this space.
# Option-N → new space. In a hidden session (agents, stash, tasks, ...) these
# do nothing but say so, decided by a format with no fork; space.sh refuses
# them there too. prefix M-1..M-7 were tmux's layout presets; replaced.
bind -n M-1 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} shell 1 '#{session_id}' '#{client_name}'" }
bind -n M-2 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} shell 2 '#{session_id}' '#{client_name}'" }
bind -n M-3 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} shell 3 '#{session_id}' '#{client_name}'" }
bind -n M-4 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} shell 4 '#{session_id}' '#{client_name}'" }
bind -n M-5 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} shell 5 '#{session_id}' '#{client_name}'" }
bind -n M-6 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} shell 6 '#{session_id}' '#{client_name}'" }
bind -n M-7 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} shell 7 '#{session_id}' '#{client_name}'" }
bind -n M-8 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} shell 8 '#{session_id}' '#{client_name}'" }
bind -n M-9 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} shell 9 '#{session_id}' '#{client_name}'" }
bind -N "Go to agent 1" M-1 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} agent 1 '#{session_id}' '#{client_name}'" }
bind -N "Go to agent 2" M-2 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} agent 2 '#{session_id}' '#{client_name}'" }
bind -N "Go to agent 3" M-3 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} agent 3 '#{session_id}' '#{client_name}'" }
bind -N "Go to agent 4" M-4 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} agent 4 '#{session_id}' '#{client_name}'" }
bind -N "Go to agent 5" M-5 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} agent 5 '#{session_id}' '#{client_name}'" }
bind -N "Go to agent 6" M-6 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} agent 6 '#{session_id}' '#{client_name}'" }
bind -N "Go to agent 7" M-7 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} agent 7 '#{session_id}' '#{client_name}'" }
bind -N "Go to agent 8" M-8 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} agent 8 '#{session_id}' '#{client_name}'" }
bind -N "Go to agent 9" M-9 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} agent 9 '#{session_id}' '#{client_name}'" }
# Option-L / Option-H are kind-aware (space.sh decides): on an agent they
# cycle this space's agents, on a shell its shells.
bind -n M-l if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} next '#{session_id}' '#{client_name}'" }
bind -n M-h if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} prev '#{session_id}' '#{client_name}'" }
bind -n M-` if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} toggle '#{session_id}' '#{client_name}'" }
bind -n M-n run-shell -C "display-popup -c '#{client_tty}' -E -w 80% -h 70% -d '#{pane_current_path}' \"#{@space_sh} new-space '#{client_tty}'\""
# Option-M → move this tab to another space: a menu of the spaces, each with
# its number as the key; the tab goes to the end of that space and you stay
# here. Not from a hidden session, not the home window.
# The WezTerm chords (User keys, above the %if): the same three rows, each
# one key. The prefix and Option bindings above stay for any other terminal.
bind -n User0 run-shell -C "#{?#{S:#{?#{==:#{@space_index},1},1,}},switch-client -t '#{S:#{?#{==:#{@space_index},1},#{session_id},}}',display-message 'no space 1'}"
bind -n User1 run-shell -C "#{?#{S:#{?#{==:#{@space_index},2},1,}},switch-client -t '#{S:#{?#{==:#{@space_index},2},#{session_id},}}',display-message 'no space 2'}"
bind -n User2 run-shell -C "#{?#{S:#{?#{==:#{@space_index},3},1,}},switch-client -t '#{S:#{?#{==:#{@space_index},3},#{session_id},}}',display-message 'no space 3'}"
bind -n User3 run-shell -C "#{?#{S:#{?#{==:#{@space_index},4},1,}},switch-client -t '#{S:#{?#{==:#{@space_index},4},#{session_id},}}',display-message 'no space 4'}"
bind -n User4 run-shell -C "#{?#{S:#{?#{==:#{@space_index},5},1,}},switch-client -t '#{S:#{?#{==:#{@space_index},5},#{session_id},}}',display-message 'no space 5'}"
bind -n User5 run-shell -C "#{?#{S:#{?#{==:#{@space_index},6},1,}},switch-client -t '#{S:#{?#{==:#{@space_index},6},#{session_id},}}',display-message 'no space 6'}"
bind -n User6 run-shell -C "#{?#{S:#{?#{==:#{@space_index},7},1,}},switch-client -t '#{S:#{?#{==:#{@space_index},7},#{session_id},}}',display-message 'no space 7'}"
bind -n User7 run-shell -C "#{?#{S:#{?#{==:#{@space_index},8},1,}},switch-client -t '#{S:#{?#{==:#{@space_index},8},#{session_id},}}',display-message 'no space 8'}"
bind -n User8 run-shell -C "#{?#{S:#{?#{==:#{@space_index},9},1,}},switch-client -t '#{S:#{?#{==:#{@space_index},9},#{session_id},}}',display-message 'no space 9'}"
bind -n User9 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} shell 1 '#{session_id}' '#{client_name}'" }
bind -n User10 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} shell 2 '#{session_id}' '#{client_name}'" }
bind -n User11 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} shell 3 '#{session_id}' '#{client_name}'" }
bind -n User12 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} shell 4 '#{session_id}' '#{client_name}'" }
bind -n User13 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} shell 5 '#{session_id}' '#{client_name}'" }
bind -n User14 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} shell 6 '#{session_id}' '#{client_name}'" }
bind -n User15 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} shell 7 '#{session_id}' '#{client_name}'" }
bind -n User16 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} shell 8 '#{session_id}' '#{client_name}'" }
bind -n User17 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} shell 9 '#{session_id}' '#{client_name}'" }
bind -n User18 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} agent 1 '#{session_id}' '#{client_name}'" }
bind -n User19 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} agent 2 '#{session_id}' '#{client_name}'" }
bind -n User20 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} agent 3 '#{session_id}' '#{client_name}'" }
bind -n User21 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} agent 4 '#{session_id}' '#{client_name}'" }
bind -n User22 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} agent 5 '#{session_id}' '#{client_name}'" }
bind -n User23 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} agent 6 '#{session_id}' '#{client_name}'" }
bind -n User24 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} agent 7 '#{session_id}' '#{client_name}'" }
bind -n User25 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} agent 8 '#{session_id}' '#{client_name}'" }
bind -n User26 if -F "#{@space_hidden}" { display-message "space: not a space" } { run-shell -b "#{@space_sh} agent 9 '#{session_id}' '#{client_name}'" }
bind -n M-m if -F "#{||:#{@space_hidden},#{@space_home}}" { display-message "space: only a tab of a space moves" } { run-shell -b "#{@space_sh} move-menu '#{window_id}' '#{client_name}'" }

# prefix Q → close this space for good, after a y/n that says what dies.
# Every tab goes through closed-tabs.sh first (CMD+Z can bring each back),
# then the session is killed and dropped from the registry. Never main.
set -g @space_n_agents '#{n:#{W:#{?#{@agent_state},x,}}}'
set -g @space_n_shells '#{n:#{W:#{?#{@agent_state},,x}}}'
set -g @space_close_prompt 'close space #{session_name}: #{E:@space_n_agents} agent#{?#{==:#{E:@space_n_agents},1},,s}, #{E:@space_n_shells} shell#{?#{==:#{E:@space_n_shells},1},,s}? (y/n)'
bind -N "Close this space" Q if -F "#{||:#{@space_hidden},#{==:#{session_name},main}}" { display-message "space: main and hidden sessions are never closed" } { confirm-before -p "#{E:@space_close_prompt}" { run-shell -b "#{@space_sh} close '#{session_id}' '#{client_name}'" } }

# The home shell is never closed by hand: it is what keeps the space alive
# when its last tab closes (as the last window, closing it would end the
# space with no y/n). CMD+W (x) and CMD+SHIFT+W (C-l) on the home PANE refuse
# and point at prefix Q; on any other pane, a split inside the home window
# included, they are exactly tmux.conf's bindings. Its shell
# exiting (`exit`, Ctrl-D) respawns it: the pane-died hook above the %if.
bind x if -F "#{@space_home_pane}" { display-message "space: home is this space's main shell · prefix Q closes the space" } { confirm-before -p "kill-pane #P? (y/n)" "run-shell -b '#{HOME}/.config/tmux/scripts/closed-tabs.sh close #{pane_id}'" }
bind C-l if -F "#{@space_home_pane}" { display-message "space: home is this space's main shell · prefix Q closes the space" } { run-shell -b "#{HOME}/.config/tmux/scripts/closed-tabs.sh close '#{pane_id}'" }

# prefix a / C-a (the session picker) belong to the pre-spaces bar: spaces
# are the sessions now. tmux.conf binds them on every load, before this file,
# so the off path needs no copy; `prefix r` after `@spaces off` brings them back.
unbind -q a
unbind -q C-a
# Option-V: the sidebar's scope, this space <-> all spaces. The sidebar's own
# Option-V is rarely reachable (clicks hand focus straight back to tmux), so
# the key lives here. Unset @strip_scope means "space" while spaces are on.
# The notifyutil post makes the Rust sidebar redraw at once.
bind -n M-v if -F "#{==:#{?#{@strip_scope},#{@strip_scope},space},space}" { set -g @strip_scope all ; display-message "sidebar: all spaces" } { set -g @strip_scope space ; display-message "sidebar: this space" } \; run-shell -b "notifyutil -p com.mackhaymond.tmux.focus"

# New tabs in a PROJECT space (session_path is not ~, not hidden) start in the
# space's folder; everywhere else they keep today's directory. Same keys and
# shapes as the bindings at the top of tmux.conf.
bind c new-window -a -c "#{?#{||:#{@space_hidden},#{==:#{session_path},#{HOME}}},#{pane_current_path},#{session_path}}"
bind C-t new-window -a -t '{end}' -c "#{?#{||:#{@space_hidden},#{==:#{session_path},#{HOME}}},#{HOME},#{session_path}}"
bind k new-window -a -c "#{?#{||:#{@space_hidden},#{==:#{session_path},#{HOME}}},#{pane_current_path},#{session_path}}" -e ZSH_AUTOSTART=claude
# C-k replaces the current tab; on home it only adds one (home stays).
bind C-k if -F "#{@space_home}" { new-window -a -c "#{session_path}" -e ZSH_AUTOSTART=claude } { new-window -a -c "#{?#{||:#{@space_hidden},#{==:#{session_path},#{HOME}}},#{pane_current_path},#{session_path}}" -e ZSH_AUTOSTART=claude ; kill-window -t - }

# Last-visited agent and shell of each space (window ids, session options),
# for Option-`. Same two hooks, for the same reasons, as the @agent_mru_*
# block in tmux.conf ([0]-[2] are taken there). Pure set -F, no fork.
set-hook -g 'session-window-changed[20]' {
  set -F @space_last_agent "#{?#{n:#{@agent_state}},#{window_id},#{@space_last_agent}}"
  set -F @space_last_shell "#{?#{n:#{@agent_state}},#{@space_last_shell},#{window_id}}"
}
set-hook -g 'client-session-changed[20]' {
  set -F @space_last_agent "#{?#{n:#{@agent_state}},#{window_id},#{@space_last_agent}}"
  set -F @space_last_shell "#{?#{n:#{@agent_state}},#{@space_last_shell},#{window_id}}"
}

# A window closed: if it was a home (killed some way the keys above don't
# guard, e.g. prefix &), sync makes a new one. A window opened: if it landed
# before home (closed-tabs reopens with -b), sync moves home back in front,
# so Option-1 is always home. Gated on the HOOK's session (not the client's,
# which may be elsewhere or absent), never for hidden ones: agents churns.
set-hook -g 'window-unlinked[20]' { if -F "#{?#{m:* #{hook_session_name} *, #{@space_hidden_sessions} },,1}" { run-shell -b "#{@space_sh} sync" } }
set-hook -g 'window-linked[20]' { if -F "#{?#{m:* #{hook_session_name} *, #{@space_hidden_sessions} },,1}" { run-shell -b "#{@space_sh} sync" } }

%else

# ── spaces off: exactly today's keys and status ─────────────────────────────
set -g status on
set -gu status-format
set -gu @space_fail
set -gu @space_need
set -gu @space_done
set -gu @space_wf
set -gu @space_cua
set -gu @space_cur
set -gu @space_hot
set -gu @space_bg
set -gu @space_ink
set -gu @space_glyph
set -gu @space_chip
set -gu @space_num
set -gu @space_here
set -gu @space_hidden_tag
set -gu @space_alert
set -gu @space_alerts
set -gu @space_shell_ord
set -gu @space_shell_label
set -gu @space_shell
set -gu @space_sel_tabs
set -gu @space_shell_tabs
set -gu @space_n_agents
set -gu @space_n_shells
set -gu @space_close_prompt
bind -n MouseDown1Status switch-client -t =
bind -N "Select window 1" 1 select-window -t :=1
bind -N "Select window 2" 2 select-window -t :=2
bind -N "Select window 3" 3 select-window -t :=3
bind -N "Select window 4" 4 select-window -t :=4
bind -N "Select window 5" 5 select-window -t :=5
bind -N "Select window 6" 6 select-window -t :=6
bind -N "Select window 7" 7 select-window -t :=7
bind -N "Select window 8" 8 select-window -t :=8
bind -N "Select window 9" 9 select-window -t :=9
unbind -q -n M-1
unbind -q -n M-2
unbind -q -n M-3
unbind -q -n M-4
unbind -q -n M-5
unbind -q -n M-6
unbind -q -n M-7
unbind -q -n M-8
unbind -q -n M-9
unbind -q -n M-l
unbind -q -n M-h
unbind -q -n M-`
unbind -q -n M-n
unbind -q -n M-m
unbind -q -n M-v
unbind -q Q
# WezTerm's CMD+1-9 send prefix M-1..9 whatever @spaces says, and with spaces
# off that key means what CMD+1-9 always did: window N. (Not tmux's stock
# prefix M-1..M-7 layout presets, which are replaced in both modes.)
bind -N "Select window 1" M-1 select-window -t :=1
bind -N "Select window 2" M-2 select-window -t :=2
bind -N "Select window 3" M-3 select-window -t :=3
bind -N "Select window 4" M-4 select-window -t :=4
bind -N "Select window 5" M-5 select-window -t :=5
bind -N "Select window 6" M-6 select-window -t :=6
bind -N "Select window 7" M-7 select-window -t :=7
bind -N "Select window 8" M-8 select-window -t :=8
bind -N "Select window 9" M-9 select-window -t :=9
# The WezTerm chords (User keys) do what their keys did before spaces: CTRL+N
# (prefix N) and CMD+N (prefix M-N) select window N; OPT+N reached the pane
# as M-N, so it still does.
bind -n User0 select-window -t :=1
bind -n User1 select-window -t :=2
bind -n User2 select-window -t :=3
bind -n User3 select-window -t :=4
bind -n User4 select-window -t :=5
bind -n User5 select-window -t :=6
bind -n User6 select-window -t :=7
bind -n User7 select-window -t :=8
bind -n User8 select-window -t :=9
bind -n User9 send-keys M-1
bind -n User10 send-keys M-2
bind -n User11 send-keys M-3
bind -n User12 send-keys M-4
bind -n User13 send-keys M-5
bind -n User14 send-keys M-6
bind -n User15 send-keys M-7
bind -n User16 send-keys M-8
bind -n User17 send-keys M-9
bind -n User18 select-window -t :=1
bind -n User19 select-window -t :=2
bind -n User20 select-window -t :=3
bind -n User21 select-window -t :=4
bind -n User22 select-window -t :=5
bind -n User23 select-window -t :=6
bind -n User24 select-window -t :=7
bind -n User25 select-window -t :=8
bind -n User26 select-window -t :=9
# Verbatim copies of the bindings in tmux.conf (the test checks).
bind c new-window -a -c "#{pane_current_path}"
bind C-t new-window -a -t '{end}' -c "#{HOME}"
bind k new-window -a -c "#{pane_current_path}" -e ZSH_AUTOSTART=claude
bind C-k new-window -a -c "#{pane_current_path}" -e ZSH_AUTOSTART=claude \; kill-window -t -
bind x confirm-before -p "kill-pane #P? (y/n)" "run-shell -b '#{HOME}/.config/tmux/scripts/closed-tabs.sh close #{pane_id}'"
bind C-l run-shell -b "#{HOME}/.config/tmux/scripts/closed-tabs.sh close '#{pane_id}'"
set-hook -gu 'session-window-changed[20]'
set-hook -gu 'client-session-changed[20]'
set-hook -gu 'window-unlinked[20]'
set-hook -gu 'window-linked[20]'
# Home shells already made stay (the sync makes no new ones while off): an
# ordinary shell then, closable with prefix x; its shell exiting still
# respawns it (the pane-died hook is not gated), until it is closed.

%endif
