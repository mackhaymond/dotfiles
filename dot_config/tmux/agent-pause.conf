# Pause key (docs/agent-pause.md). Sourced from tmux.conf; not a template.
#
# prefix P before the lid closes: every agent the tab state says is WORKING
# (@agent_state running, or a workflow/subagent or app drive in flight) is
# told to drop its work now and clean up, and exactly that set is saved. prefix P again
# tells that SAME saved set to resume, never a fresh scan: by then states
# have moved on, and idle agents were never paused, so must not be "resumed".
# Messages go through tmux-mcp's message_agent so a half-typed draft in an
# agent's prompt box holds the message instead of fusing with it.
#
# The status lives in the sidebar's pause banner and CuaNotch's glow; a press
# says its outcome as a toast on the client that pressed it (#{client_name}).
# The big popup (live per-agent rows; Enter resumes, Esc closes) is opt-in:
# set this to on to get it back.
set -g @agent_pause_popup off
# Rate-limited agents (docs "Rate-limited agents"): send the limit's own resume once it lifts; off = mark lifted and ask Mack.
set -g @agent_limit_autoresume on
# -b: delivery waits on tmux-mcp, so it must not freeze the client.
bind-key P run-shell -b "#{HOME}/.config/tmux/scripts/agent-pause.py toggle '#{client_name}'"
