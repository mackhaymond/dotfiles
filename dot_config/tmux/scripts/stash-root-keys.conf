# prefix v's mode keys in the ROOT table, for as long as a range selection
# exists. NOT part of tmux.conf: stash.sh `source-file`s this when sel-start
# paints a selection, and sel_clear (every way a selection ends) unbinds these
# twelve keys in one call. tmux.conf.tmpl's stash section has the why; in short:
#
#   - they keep the mode's keys working after the client has been knocked out
#     of the `stash` key table (a click, FocusOut/FocusIn — into the WezTerm
#     sidebar and back —, a stray key, another session and back);
#   - they must NOT be there at rest (2026-10-21, review): a key that misses in
#     the PREFIX table is retried in root, and tmux swallows it only if root
#     has no binding either. With these bound permanently C-s Esc reached the
#     pane as \x1b (which interrupts a Claude turn), C-s Enter as \r and C-s
#     C-c as \x03.
#
# Each line: with a selection in THIS session (@stash_live, fork-free) do what
# the `stash` table's binding for the key does — identical text,
# tests/test_stash_keys.py checks it — else hand the key to the pane with
# `send-keys`, byte-exact (same test). The guard is kept even though these only
# exist during a selection: a selection in another session, or a stash.sh that
# died before its clear, then still leaves every pane's typing alone.
#
# The key list is stash.sh's STASH_ROOT_KEYS; the unbind removes ANY root
# binding of these keys, so nothing else may bind them in root (nothing does).
bind-key -n h      if -F "#{E:@stash_live}" { switch-client -T stash ; run-shell "#{HOME}/.config/tmux/scripts/stash.sh sel-move left '#{window_id}'" } { send-keys h }
bind-key -n l      if -F "#{E:@stash_live}" { switch-client -T stash ; run-shell "#{HOME}/.config/tmux/scripts/stash.sh sel-move right '#{window_id}'" } { send-keys l }
bind-key -n j      if -F "#{E:@stash_live}" { switch-client -T stash ; run-shell "#{HOME}/.config/tmux/scripts/stash.sh sel-move right '#{window_id}'" } { send-keys j }
bind-key -n k      if -F "#{E:@stash_live}" { switch-client -T stash ; run-shell "#{HOME}/.config/tmux/scripts/stash.sh sel-move left '#{window_id}'" } { send-keys k }
bind-key -n H      if -F "#{E:@stash_live}" { run-shell -b "#{HOME}/.config/tmux/scripts/stash.sh sel-commit '#{window_id}'" } { send-keys H }
bind-key -n Enter  if -F "#{E:@stash_live}" { run-shell -b "#{HOME}/.config/tmux/scripts/stash.sh sel-commit '#{window_id}'" } { send-keys Enter }
bind-key -n m      if -F "#{E:@stash_live}" { run-shell "#{HOME}/.config/tmux/scripts/stash.sh sel-send '#{window_id}' '#{client_name}'" } { send-keys m }
bind-key -n a      if -F "#{E:@stash_live}" { run-shell "#{HOME}/.config/tmux/scripts/stash.sh sel-send '#{window_id}' '#{client_name}'" } { send-keys a }
bind-key -n Escape if -F "#{E:@stash_live}" { run-shell "#{HOME}/.config/tmux/scripts/stash.sh sel-cancel" } { send-keys Escape }
bind-key -n q      if -F "#{E:@stash_live}" { run-shell "#{HOME}/.config/tmux/scripts/stash.sh sel-cancel" } { send-keys q }
bind-key -n C-c    if -F "#{E:@stash_live}" { run-shell "#{HOME}/.config/tmux/scripts/stash.sh sel-cancel" } { send-keys C-c }
bind-key -n Space  if -F "#{E:@stash_live}" { run-shell "#{HOME}/.config/tmux/scripts/stash.sh sel-cancel" } { send-keys Space }
