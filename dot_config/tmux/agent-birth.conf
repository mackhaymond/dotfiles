# AGENT BIRTH (docs/agent-tab-indicator.md, "Born an agent"). Sourced by
# tmux.conf and by spaces.conf (which a test server sources on its own).
#
# A claude tab is a plain zsh that .zshrc turns into claude (ZSH_AUTOSTART),
# and until claude's first hook fires (1-3 s) nothing marked the window as an
# agent: it counted as a shell (⌥N numbering, the SHELLS list, the tab style),
# then flipped. Every place that opens one now runs, in the SAME command list
# right after its new-window (which makes the new window the list's target):
#
#     new-window ... -e ZSH_AUTOSTART=claude ; run-shell -C "#{@agent_birth} claude"
#
# so the window is a fresh, not-yet-prompted agent before anything draws it:
#   @agent_state idle          what SessionStart sets first
#   @agent_since "<epoch> idle"
#   @agent_summary "<project>/New Session"   SessionStart's placeholder, the
#                              project spelled as the indicator's project_name
#                              (the cwd's basename cut to 20, ~ for $HOME)
#   @agent_kind <kind>         the word after the expansion: claude | codex |
#                              opencode (closed-tabs.sh reopens all three)
#   @agent_born <epoch>        the watcher's BIRTH GRACE: a window with no agent
#                              process yet is not collected for 30 s; once the
#                              agent shows up the watcher drops the mark. If
#                              claude never starts, the tab turns back into a
#                              shell after the grace (plus the usual GC_TICKS).
#
# An option run through `run-shell -C`, NOT a command-alias: tmux parses a
# whole config file before running any of it and expands aliases while
# parsing, so an alias defined in tmux.conf is unknown to tmux.conf's own bind
# lines on a cold start - and one unknown command fails the ENTIRE file.
# run-shell -C parses its string when the key is pressed. Scripts guard it with
# #{?@agent_birth,...,} so a server that predates this file still opens the tab.
set -g @agent_birth 'set -w @agent_state idle ; set -wF @agent_born "#{window_activity}" ; set -wF @agent_since "#{window_activity} idle" ; set -wF @agent_summary "#{?#{==:#{pane_current_path},#{HOME}},~,#{=20:#{b:pane_current_path}}}/New Session" ; set -w @agent_kind'
