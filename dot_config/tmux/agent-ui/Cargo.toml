[package]
name = "agent-ui"
version = "0.1.0"
edition = "2021"
description = "The agent sidebar (WezTerm split) and Option-W menu: one Rust binary over the tmux hook state"
publish = false

[lib]
name = "agent_ui"
path = "src/lib.rs"

[[bin]]
name = "agent-ui"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false
