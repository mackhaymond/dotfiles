format = """
${env_var.NU_TAB}\
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
${env_var.STARSHIP_CHEZMOI_DRIFT_LIVE}\
${env_var.STARSHIP_CHEZMOI_DRIFT_UNCOMMITTED}\
${env_var.STARSHIP_CHEZMOI_DRIFT_SYNC}\
${env_var.STARSHIP_CHEZMOI_DRIFT_STALE}\
$cmd_duration\
${env_var.STARSHIP_JOBS_STOPPED}\
${env_var.STARSHIP_JOBS_RUNNING}\
$line_break\
$python\
$character"""

# Pure's `user@host` (grey). Only renders over SSH (or as root), so it never
# shows on the Mac itself — without these, starship's defaults ("user in
# 🌐 host in") leak into the prompt on remote boxes like seasnet.
[username]
style_user = "bright-black"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_symbol = ""
style = "bright-black"
format = "[@$hostname]($style) "

[directory]
style = "blue"
truncate_to_repo = false
truncation_symbol = "../"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[$branch]($style)"
style = "bright-black"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style) "
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[python]
format = "[$virtualenv]($style) "
style = "bright-black"

# Shell job indicators. The env vars are maintained by the
# `_starship_jobs_state` precmd hook in ~/.zshrc, which reads zsh's
# $jobstates assoc array (no fork, no I/O). Modules render only when the
# corresponding var is set & non-empty; precmd unsets them when count is 0.
#   ⏸ = stopped jobs (Ctrl+Z'd — forgotten vim/less/htop). Red = attention.
#   ⚙ = running background jobs (`cmd &`). Cyan = informational.
[env_var.STARSHIP_JOBS_STOPPED]
description = "Suspended (Ctrl+Z'd) jobs — set by zsh precmd from $jobstates."
format = "[⏸ $env_value]($style) "
style = "bold red"

[env_var.STARSHIP_JOBS_RUNNING]
description = "Running background (&) jobs — set by zsh precmd from $jobstates."
format = "[⚙ $env_value]($style) "
style = "bold cyan"

# Nushell data-tab marker. $NU_TAB is set by ~/.config/nushell/env.nu and is
# never set in zsh, so this renders only in a nu tab and costs zsh nothing.
# Same [env_var.*] pattern as the modules below — one starship config
# serving both shells rather than a second copy to keep in sync.
#
# The drift indicator is driven by a zsh precmd hook that does not run in nu.
# A `prefix N` tab starts clean, but `nu` typed at a zsh prompt would inherit
# the exported vars frozen at launch, so env.nu hide-env's them. Either way a
# nu tab never shows drift — correct, since chezmoi drift is a zsh-tab concern.
[env_var.NU_TAB]
description = "Set to 'nu' by nushell's env.nu; marks the structured-data tab."
format = "[$env_value](bold #cba6f7) "

# chezmoi drift indicator. The env vars are maintained by the
# `_chezmoi_drift_check` precmd hook in ~/.zshrc, which mirrors the
# background-refreshed cache file (~/.cache/chezmoi-drift/state) into the env
# via zsh's no-fork `$(<file)` read. Zero subshell forks per prompt (previously
# this was a [custom.*] block that ran sh+cat + sh+test per prompt).
# Glyphs: ~ live drift, * uncommitted, ⇡ ahead, ⇣ behind, ? fetch >24h stale.
#
# One [env_var] module = one style, so each glyph class gets its own var and
# its own weight. The point: `*` (you edited a source file — the normal state
# of a live dotfiles repo) must NOT look like `~` (a managed live file has
# diverged from source and the next `chezmoi apply` will clobber it). Bold red
# is reserved for `~`. Every module renders only while its var is set AND
# non-empty on the zsh side (a set-but-empty var renders a bare prefix — the
# `_chezmoi_drift_export` function in .zshrc exports a class's var only when
# it has glyphs and unsets it otherwise; keep that discipline).
#
# Order in `format` above: live drift first (it is the alarm), then the
# informational git state.

# `~` — live drift. The one that should stop you.
[env_var.STARSHIP_CHEZMOI_DRIFT_LIVE]
description = "chezmoi live drift (~): a managed live file differs from its source."
format = "[⚠ $env_value]($style) "
style = "bold red"

# `*` — uncommitted source changes. You have work to save, not a problem.
[env_var.STARSHIP_CHEZMOI_DRIFT_UNCOMMITTED]
description = "chezmoi source repo has uncommitted changes (*)."
format = "[$env_value]($style) "
style = "yellow"

# `⇡` / `⇣` — source repo ahead of / behind origin.
[env_var.STARSHIP_CHEZMOI_DRIFT_SYNC]
description = "chezmoi source repo ahead (⇡) / behind (⇣) origin."
format = "[$env_value]($style) "
style = "blue"

# `?` — no successful fetch in 24h, so ⇡/⇣ may be stale. Deliberately dim.
[env_var.STARSHIP_CHEZMOI_DRIFT_STALE]
description = "chezmoi source repo: no successful fetch in 24h (?)."
format = "[$env_value]($style) "
style = "bright-black"
